[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia-decision-auditor"
version = "0.1.0"
description = "Reproducible data foundation for the Aletheia research project"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.0",
  "sqlalchemy==2.1.4",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "mlflow==3.17.0",
  "PyJWT[crypto]==2.15.1",
  "httpx==0.28.1",
  "packaging==26.3",
]

[project.scripts]
aletheia-admin = "aletheia.application.operator:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "live_data: explicitly authorized network test against the official UCI source",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
