[policy]
version = "healthcare-feature-v1"
dataset_identifier = "uci-diabetes-296-v1"

[roles]
prediction = ["admission_type_id", "admission_source_id", "time_in_hospital", "num_lab_procedures", "num_procedures", "num_medications", "number_outpatient", "number_emergency", "number_inpatient", "number_diagnoses", "max_glu_serum", "A1Cresult", "diabetesMed"]
