name: Azure showcase

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-showcase-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ACR_NAME: acraletheiasea1017
      ACR_LOGIN_SERVER: acraletheiasea1017.azurecr.io
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify frozen release inputs
        run: python deployment/azure/ci-frozen-check.py
      - name: Focused backend checks
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock.txt
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m pytest tests/application/test_case_workflow.py tests/application/test_release_auth.py tests/deployment/test_ci_rollback.py tests/deployment/test_ci_frozen_check.py -q
          python -m ruff check --select F deployment/azure/ci-frozen-check.py deployment/azure/ci-guard.py deployment/azure/ci-smoke.py deployment/azure/ci-secret-scan.py
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run contract:check
          npm run build
      - name: Scan deployable source and built assets for credentials
        run: python deployment/azure/ci-secret-scan.py
      - name: Azure federated login
        if: github.event_name != 'pull_request'
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push immutable release images
        if: github.event_name != 'pull_request'
        id: images
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME" --only-show-errors
          tag="ci-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --file deployment/Dockerfile.frontend --build-arg VITE_PROVISIONED_IDENTITY=true --tag "aletheia-frontend-base:$tag" .
          docker build --file deployment/azure/Dockerfile.frontend --build-arg "FRONTEND_BASE=aletheia-frontend-base:$tag" --tag "$ACR_LOGIN_SERVER/frontend:$tag" .
          docker build --file deployment/azure/Dockerfile.workload-backend --build-arg "BACKEND_BASE=$ACR_LOGIN_SERVER/backend@sha256:06f7bb2229fb1c77b6561afaeccdbf51c9a0243005fb0ea647a8d6de44f683ab" --tag "$ACR_LOGIN_SERVER/backend:$tag" .
          docker push "$ACR_LOGIN_SERVER/frontend:$tag"
          docker push "$ACR_LOGIN_SERVER/backend:$tag"
          frontend_digest=$(az acr manifest show-metadata -r "$ACR_NAME" -n "frontend:$tag" --query digest -o tsv --only-show-errors)
          backend_digest=$(az acr manifest show-metadata -r "$ACR_NAME" -n "backend:$tag" --query digest -o tsv --only-show-errors)
          [[ $frontend_digest =~ ^sha256:[0-9a-f]{64}$ && $backend_digest =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'frontend_digest=%s\nbackend_digest=%s\n' "$frontend_digest" "$backend_digest" >> "$GITHUB_OUTPUT"
      - name: Validate topology, migrate, deploy and smoke test
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          FRONTEND_DIGEST: ${{ steps.images.outputs.frontend_digest }}
          BACKEND_DIGEST: ${{ steps.images.outputs.backend_digest }}
        run: bash deployment/azure/ci-deploy.sh
